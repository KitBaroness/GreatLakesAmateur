<div id="page-content">
  <section class="c-page-header c-page-header--compact">
    <h1 class="c-page-header__title">Live Results</h1>
    <p class="c-page-header__subtitle" data-live-scoring-subtitle>Great Lakes Amateur leaderboard updates from Golf Genius</p>
  </section>

  <section class="c-live-scoring" data-live-scoring-root>
    <div class="c-live-scoring__status" data-live-scoring-status hidden></div>

    <p class="c-live-scoring__note" data-live-scoring-note hidden></p>

    <div class="c-live-scoring__embed" data-live-scoring-embed>
      <div class="c-live-scoring__viewport" data-live-scoring-viewport>
        <div class="c-live-scoring__loading" data-live-scoring-loading aria-live="polite" aria-busy="true">
          Loading live results...
        </div>
        <iframe
          class="c-live-scoring__frame"
          data-live-scoring-frame
          title="Great Lakes Amateur live tournament results"
          referrerpolicy="strict-origin-when-cross-origin"
          loading="eager"
        ></iframe>
      </div>
    </div>

    <div class="c-live-scoring__fallback" data-live-scoring-fallback hidden>
      <p class="c-live-scoring__fallback-copy">Results are taking longer than expected on this connection. You can keep waiting or open Golf Genius directly.</p>
      <a class="c-button c-button--secondary c-live-scoring__fallback-open" href="#" data-live-scoring-fallback-open target="_blank" rel="noopener noreferrer">
        Open on Golf Genius
      </a>
    </div>

    <p class="c-live-scoring__external">
      <a class="c-live-scoring__external-link" href="#" data-live-scoring-external target="_blank" rel="noopener noreferrer" hidden>
        Having trouble? View full results on Golf Genius
      </a>
    </p>
  </section>
</div>
